<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Homepage</title>
    <meta
      name="description"
      content="吴洪的个人项目主页，展示具身智能、农业机器人、RAG Agent 与视觉系统相关项目。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="#top">
          <span class="brand-mark">WH</span>
          <span id="brandName">吴洪</span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="#projects">Projects</a>
          <a href="#research">Research</a>
          <a href="#publications">Papers</a>
          <a href="#background">Background</a>
          <a href="#contact">Contact</a>
        </nav>
      </header>

      <main id="top">
        <section class="masthead">
          <p class="eyebrow">Personal Homepage</p>
          <div class="masthead-grid">
            <div>
              <h1 id="heroName">吴洪</h1>
              <p class="masthead-role" id="heroRole"></p>
            </div>
            <div class="masthead-copy">
              <p class="masthead-affiliation" id="heroAffiliation"></p>
              <p id="aboutText"></p>
              <ul class="keyword-list" id="focusTags"></ul>
              <div class="quick-links" id="quickLinks"></div>
            </div>
          </div>
        </section>

        <section class="section-block project-section">
          <div class="section-title" data-section="01">
            <p class="eyebrow">Featured Projects</p>
            <h2 id="projects" data-section="01">项目与作品</h2>
          </div>
          <div class="project-list" id="projectList"></div>
        </section>

        <section class="section-block split-section">
          <div>
            <div class="section-title" data-section="02">
              <p class="eyebrow">Research Notes</p>
              <h2 id="research" data-section="02">研究方向</h2>
            </div>
            <div class="stack-list" id="researchList"></div>
          </div>
          <div>
            <div class="section-title" data-section="03">
              <p class="eyebrow">News</p>
              <h2 data-section="03">近期动态</h2>
            </div>
            <div class="timeline-list" id="newsList"></div>
          </div>
        </section>

        <section class="section-block">
          <div class="section-title" data-section="04">
            <p class="eyebrow">Publication</p>
            <h2 id="publications" data-section="04">代表论文</h2>
          </div>
          <div class="publication-list" id="publicationList"></div>
        </section>

        <section class="section-block split-section" id="background">
          <div>
            <div class="section-title" data-section="05">
              <p class="eyebrow">Background</p>
              <h2 data-section="05">教育与科研经历</h2>
            </div>
            <div class="timeline-list" id="experienceList"></div>
          </div>
          <div>
            <div class="section-title" data-section="06">
              <p class="eyebrow">Practice</p>
              <h2 data-section="06">能力与特点</h2>
            </div>
            <div class="stack-list" id="serviceList"></div>
          </div>
        </section>

        <section class="section-block contact-section">
          <div class="section-title" data-section="07">
            <p class="eyebrow">Contact</p>
            <h2 id="contact" data-section="07">联系与合作</h2>
          </div>
          <div class="contact-panel">
            <p id="contactText"></p>
            <div class="contact-links" id="contactLinks"></div>
          </div>
        </section>
      </main>
    </div>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button class="lightbox-close" id="lightboxClose" aria-label="关闭预览">×</button>
      <div class="lightbox-dialog">
        <img class="lightbox-image" id="lightboxImage" alt="" hidden />
        <video class="lightbox-video" id="lightboxVideo" controls playsinline hidden></video>
        <p class="lightbox-caption" id="lightboxCaption"></p>
      </div>
    </div>

    <script src="./site-data.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
