<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Homepage</title>
    <meta
      name="description"
      content="吴洪的个人项目主页，展示具身智能、农业机器人、RAG Agent 与视觉系统相关项目。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Noto+Serif+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="#top">
          <span class="brand-mark">W</span>
          <span id="brandName">吴洪</span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="#projects">项目</a>
          <a href="#about">简介</a>
          <a href="#research">研究</a>
          <a href="#publications">论文</a>
          <a href="#contact">联系</a>
        </nav>
      </header>

      <main id="top">
        <section class="section-layout feature-layout">
          <div class="feature-main">
            <div class="section-title">
              <p class="eyebrow">Projects First</p>
              <h2 id="projects">项目展示</h2>
            </div>
            <div class="project-list" id="projectList"></div>
          </div>
          <aside class="feature-side">
            <div class="section-title">
              <p class="eyebrow">About</p>
              <h2 id="about">个人简介</h2>
            </div>
            <div class="card intro-card">
              <h1 class="intro-name" id="heroName">吴洪</h1>
              <div class="meta-block">
                <p class="meta-label">Affiliation</p>
                <p class="meta-value" id="heroAffiliation"></p>
              </div>
              <div class="meta-block">
                <p class="meta-label">About</p>
                <p id="aboutText"></p>
              </div>
              <div class="meta-block">
                <p class="meta-label">Focus</p>
                <ul class="tag-list" id="focusTags"></ul>
              </div>
              <div class="meta-block">
                <p class="meta-label">Quick Links</p>
                <div class="quick-links" id="quickLinks"></div>
              </div>
            </div>
          </aside>
        </section>

        <section class="section-layout two-column">
          <div>
            <div class="section-title">
              <p class="eyebrow">Research</p>
              <h2 id="research">研究方向</h2>
            </div>
            <div class="stack-list" id="researchList"></div>
          </div>
          <div>
            <div class="section-title">
              <p class="eyebrow">News</p>
              <h2>近期动态</h2>
            </div>
            <div class="timeline-list" id="newsList"></div>
          </div>
        </section>

        <section class="section-layout">
          <div class="section-title">
            <p class="eyebrow">Publication</p>
            <h2 id="publications">代表论文</h2>
          </div>
          <div class="publication-list" id="publicationList"></div>
        </section>

        <section class="section-layout two-column">
          <div>
            <div class="section-title">
              <p class="eyebrow">Experience</p>
              <h2 id="experience">教育与科研经历</h2>
            </div>
            <div class="timeline-list" id="experienceList"></div>
          </div>
          <div>
            <div class="section-title">
              <p class="eyebrow">Strength</p>
              <h2>能力与特点</h2>
            </div>
            <div class="stack-list" id="serviceList"></div>
          </div>
        </section>

        <section class="section-layout contact-section">
          <div class="section-title">
            <p class="eyebrow">Contact</p>
            <h2 id="contact">联系与合作</h2>
          </div>
          <div class="card contact-card">
            <div>
              <p class="contact-heading">欢迎联系</p>
              <p id="contactText"></p>
            </div>
            <div class="contact-links" id="contactLinks"></div>
          </div>
        </section>
      </main>
    </div>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button class="lightbox-close" id="lightboxClose" aria-label="关闭预览">×</button>
      <div class="lightbox-dialog">
        <img class="lightbox-image" id="lightboxImage" alt="" hidden />
        <video class="lightbox-video" id="lightboxVideo" controls playsinline hidden></video>
        <p class="lightbox-caption" id="lightboxCaption"></p>
      </div>
    </div>

    <script src="./site-data.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
